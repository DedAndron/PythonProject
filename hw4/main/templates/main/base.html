<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Телефонна книга{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f6;
        }

        .navbar {
            background-color: #26374d;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .main-container {
            max-width: 1100px;
            margin: 40px auto;
        }

        .content-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.07);
        }

        .section-title {
            color: #26374d;
            border-bottom: 2px solid #3986cf;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="{% url 'contact_list' %}">
                Телефонна книга
            </a>

            <div class="ms-auto">
                <a href="{% url 'contact_create' %}"
                   class="btn btn-primary">
                    + Додати контакт
                </a>
            </div>

        </div>
    </nav>

    <main class="container main-container">

        {% block content %}
        {% endblock %}

    </main>

    <footer class="text-center text-muted py-3">
        © 2026 Телефонна книга
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
