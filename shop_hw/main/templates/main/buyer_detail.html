
{% extends 'main/base.html' %}

{% block title %}Buyer Details{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h2 class="mb-4">Buyer Information</h2>

        <p>
            <strong>First Name:</strong>
            {{ buyer.first_name }}
        </p>

        <p>
            <strong>Last Name:</strong>
            {{ buyer.last_name }}
        </p>

        <p>
            <strong>Phone Number:</strong>
            {{ buyer.phone_number }}
        </p>

        <p>
            <strong>Email:</strong>
            {{ buyer.email }}
        </p>

        <a href="{% url 'buyer_list' %}"
           class="btn btn-secondary mt-3">
            Back to Buyers
        </a>

    </div>

</div>

{% endblock %}
