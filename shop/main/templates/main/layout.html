{% load static %}
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{%endblock%}</title>

    <!-- Bootstrap 5 -->
    <link href="{% static 'main/css/bootstrap.min.css' %}" rel="stylesheet">
    <script defer src="{% static 'main/js/create_card.js' %}"></script>
</head>
<body class="bg-light">

    <!-- Меню -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'main:home' %}">Мій сайт</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'main:home' %}">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'main:about' %}">Про нас</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Послуги</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Контакти</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'main:register' %}">Registration</a>
                    </li>
                </ul>
            </div>
        </div>
        <form class="d-flex my-3" action="{% url 'main:search' %}" method="get">
            <input
                class="form-control me-2"
                type="search"
                name="title"
                placeholder="Поиск товаров..."
                aria-label="Поиск"
            >
            <button class="btn btn-outline-primary" type="submit">
                <i class="bi bi-search"></i> Найти
            </button>
        </form>
    </nav>

    <!-- Основний контент -->
    <main class="container mt-4">

        {% block content %}{% endblock %}
    </main>

    <!-- Підвал -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">© 2026 Мій сайт. Усі права захищені.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="{% static 'main/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
