{% extends 'main/layout.html' %}
{% load static %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="card shadow-sm" style="max-width: 480px">
        <img src="{% static 'main/images/'|add:card.image %}" class="card-img-top" alt="{{ card.title }}">
        <div class="card-body">
            <h1 class="card-title h4">{{ card.title }}</h1>
            <p class="card-text">{{ card.description }}</p>
        </div>
    </div>
{% endblock %}
