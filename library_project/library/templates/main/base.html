
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Library{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        :root {
            --library-ink: #172b4d;
            --library-muted: #68778d;
            --library-accent: #3563e9;
            --library-surface: #ffffff;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--library-ink);
            background: #f4f7fb;
        }

        .navbar {
            background: #14213d;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: .02em;
        }

        main {
            flex: 1;
            width: 100%;
        }

        .page-heading {
            margin-bottom: 1.5rem;
        }

        .page-heading p,
        .text-muted {
            color: var(--library-muted) !important;
        }

        .library-card {
            border: 1px solid #e6ebf2;
            border-radius: 1rem;
            background: var(--library-surface);
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .library-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 1rem 2rem rgba(23, 43, 77, .09) !important;
        }

        .content-panel {
            border: 1px solid #e6ebf2;
            border-radius: 1rem;
            background: var(--library-surface);
        }

        .form-control,
        .btn {
            border-radius: .65rem;
        }

        .table > :not(caption) > * > * {
            padding: .9rem 1rem;
        }

        footer {
            background: #14213d;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'book_list' %}">
            <span class="d-inline-flex align-items-center justify-content-center bg-primary rounded-3 me-2"
                  style="width: 2rem; height: 2rem;" aria-hidden="true">L</span>
            Library
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'book_list' %}">Books</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'reader_list' %}">Readers</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close"
                        aria-label="Close"
                        data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</main>

<footer class="text-white-50 text-center py-4 mt-5">
    <p class="mb-0">Library Management System</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
